<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitHub 中國象棋 (手機優先版)</title>
    <style>
        :root {
            --board-bg: #e6c280;
            --piece-bg: #f9e3b1;
            --red-color: #c00000;
            --black-color: #111111;
        }
        body {
            font-family: "KaiTi", "BiauKai", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px 5px;
            overflow-x: hidden; /* 防止手機端橫向滑動 */
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 26px;
            text-align: center;
        }
        .status-panel {
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: bold;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap; /* 手機端螢幕太小時自動換行 */
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
        button {
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 16px; /* 加大觸控面積 */
            cursor: pointer;
            background-color: #fff;
            border: 2px solid #555;
            border-radius: 8px;
            transition: 0.2s;
            touch-action: manipulation; /* 提升手機端點擊反應速度，防止雙擊縮放 */
        }
        button:hover {
            background-color: #eee;
        }
        
        /* 遊戲區塊容器：處理手機端縮放的空間預留 */
        #game-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #board {
            position: relative;
            width: 450px;
            height: 500px;
            background-color: var(--board-bg);
            border: 3px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-image: 
                linear-gradient(#333 1px, transparent 1px),
                linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 25px 25px;
        }

        /* 手機螢幕自動等比縮放 */
        @media (max-width: 480px) {
            #board {
                /* 依照螢幕寬度自動縮放棋盤比例 */
                transform: scale(calc(100vw / 480));
                transform-origin: top center;
            }
            #game-wrapper {
                /* 配合縮放比例，預留相應的高度，避免遮擋下方元素 */
                height: calc(500px * (100vw / 480));
            }
        }

        #river {
            position: absolute;
            top: 225px;
            left: 25px;
            width: 400px;
            height: 50px;
            background-color: var(--board-bg);
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: 32px;
            color: #333;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            pointer-events: none;
        }
        .cell {
            position: absolute;
            width: 50px;
            height: 50px;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .piece {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #fff3d6, var(--piece-bg));
            border-radius: 50%;
            border: 2px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            user-select: none;
            transition: transform 0.1s;
        }
        .piece.red { color: var(--red-color); border-color: var(--red-color); }
        .piece.black { color: var(--black-color); border-color: var(--black-color); }
        .piece.selected {
            transform: scale(1.15);
            box-shadow: 0 0 10px 3px rgba(0, 150, 255, 0.7);
        }
    </style>
</head>
<body>

    <h1>GitHub 中國象棋</h1>
    
    <div class="status-panel" id="statusText">紅方下棋</div>
    
    <div class="controls">
        <button onclick="undo()">↶ 悔棋</button>
        <button onclick="restart()">↻ 重新開始</button>
        <button onclick="resign()">🏳 投降</button>
    </div>

    <div id="game-wrapper">
        <div id="board">
            <div id="river"><span>楚 河</span><span>漢 界</span></div>
        </div>
    </div>

    <script>
        const INITIAL_STATE = [
            // 黑方
            { id: 'b_c1', type: '車', color: 'black', x: 0, y: 0 }, { id: 'b_h1', type: '馬', color: 'black', x: 1, y: 0 },
            { id: 'b_e1', type: '象', color: 'black', x: 2, y: 0 }, { id: 'b_a1', type: '士', color: 'black', x: 3, y: 0 },
            { id: 'b_g', type: '將', color: 'black', x: 4, y: 0 }, { id: 'b_a2', type: '士', color: 'black', x: 5, y: 0 },
            { id: 'b_e2', type: '象', color: 'black', x: 6, y: 0 }, { id: 'b_h2', type: '馬', color: 'black', x: 7, y: 0 },
            { id: 'b_c2', type: '車', color: 'black', x: 8, y: 0 },
            { id: 'b_p1', type: '砲', color: 'black', x: 1, y: 2 }, { id: 'b_p2', type: '砲', color: 'black', x: 7, y: 2 },
            { id: 'b_s1', type: '卒', color: 'black', x: 0, y: 3 }, { id: 'b_s2', type: '卒', color: 'black', x: 2, y: 3 },
            { id: 'b_s3', type: '卒', color: 'black', x: 4, y: 3 }, { id: 'b_s4', type: '卒', color: 'black', x: 6, y: 3 },
            { id: 'b_s5', type: '卒', color: 'black', x: 8, y: 3 },
            // 紅方
            { id: 'r_c1', type: '俥', color: 'red', x: 0, y: 9 }, { id: 'r_h1', type: '傌', color: 'red', x: 1, y: 9 },
            { id: 'r_e1', type: '相', color: 'red', x: 2, y: 9 }, { id: 'r_a1', type: '仕', color: 'red', x: 3, y: 9 },
            { id: 'r_g', type: '帥', color: 'red', x: 4, y: 9 }, { id: 'r_a2', type: '仕', color: 'red', x: 5, y: 9 },
            { id: 'r_e2', type: '相', color: 'red', x: 6, y: 9 }, { id: 'r_h2', type: '傌', color: 'red', x: 7, y: 9 },
            { id: 'r_c2', type: '俥', color: 'red', x: 8, y: 9 },
            { id: 'r_p1', type: '炮', color: 'red', x: 1, y: 7 }, { id: 'r_p2', type: '炮', color: 'red', x: 7, y: 7 },
            { id: 'r_s1', type: '兵', color: 'red', x: 0, y: 6 }, { id: 'r_s2', type: '兵', color: 'red', x: 2, y: 6 },
            { id: 'r_s3', type: '兵', color: 'red', x: 4, y: 6 }, { id: 'r_s4', type: '兵', color: 'red', x: 6, y: 6 },
            { id: 'r_s5', type: '兵', color: 'red', x: 8, y: 6 }
        ];

        let pieces = [];
        let currentTurn = 'red';
        let selectedPiece = null;
        let history = [];
        let gameActive = true;

        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('statusText');

        function initGame() {
            pieces = JSON.parse(JSON.stringify(INITIAL_STATE));
            currentTurn = 'red';
            selectedPiece = null;
            history = [];
            gameActive = true;
            updateStatus();
            renderBoard();
        }

        function renderBoard() {
            const oldCells = document.querySelectorAll('.cell');
            oldCells.forEach(cell => cell.remove());

            for (let y = 0; y <= 9; y++) {
                for (let x = 0; x <= 8; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.left = (x * 50 + 25) + 'px';
                    cell.style.top = (y * 50 + 25) + 'px';
                    cell.onclick = () => handleSquareClick(x, y);

                    const piece = pieces.find(p => p.x === x && p.y === y);
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `piece ${piece.color}`;
                        if (selectedPiece && selectedPiece.id === piece.id) {
                            pieceEl.classList.add('selected');
                        }
                        pieceEl.innerText = piece.type;
                        cell.appendChild(pieceEl);
                    }
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleSquareClick(x, y) {
            if (!gameActive) return;
            const targetPiece = pieces.find(p => p.x === x && p.y === y);

            if (selectedPiece) {
                if (targetPiece && targetPiece.color === currentTurn) {
                    selectedPiece = targetPiece;
                    renderBoard();
                    return;
                }

                saveHistory();

                if (targetPiece && targetPiece.color !== currentTurn) {
                    pieces = pieces.filter(p => p.id !== targetPiece.id);
                    if (targetPiece.type === '將' || targetPiece.type === '帥') {
                        gameActive = false;
                        setTimeout(() => alert(`${currentTurn === 'red' ? '紅' : '黑'}方獲勝！`), 100);
                    }
                }

                const movingPiece = pieces.find(p => p.id === selectedPiece.id);
                movingPiece.x = x;
                movingPiece.y = y;

                selectedPiece = null;
                if(gameActive) {
                    currentTurn = currentTurn === 'red' ? 'black' : 'red';
                    updateStatus();
                }
                renderBoard();

            } else {
                if (targetPiece && targetPiece.color === currentTurn) {
                    selectedPiece = targetPiece;
                    renderBoard();
                }
            }
        }

        function saveHistory() {
            history.push({
                pieces: JSON.parse(JSON.stringify(pieces)),
                turn: currentTurn
            });
        }

        function undo() {
            if (!gameActive && history.length > 0) {
                gameActive = true; 
            }
            if (history.length > 0) {
                const lastState = history.pop();
                pieces = lastState.pieces;
                currentTurn = lastState.turn;
                selectedPiece = null;
                updateStatus();
                renderBoard();
            } else {
                alert("已經是開局狀態，無法悔棋！");
            }
        }

        function restart() {
            if(confirm("確定要重新開始一局嗎？")) {
                initGame();
            }
        }

        function resign() {
            if (!gameActive) return;
            if(confirm(`確定要投降嗎？`)) {
                gameActive = false;
                const winner = currentTurn === 'red' ? '黑' : '紅';
                statusEl.innerText = `${currentTurn === 'red' ? '紅' : '黑'}方投降，${winner}方獲勝！`;
                statusEl.style.color = currentTurn === 'red' ? 'black' : '#c00000';
                alert(`${winner}方獲勝！`);
            }
        }

        function updateStatus() {
            statusEl.innerText = currentTurn === 'red' ? '紅方下棋' : '黑方下棋';
            statusEl.style.color = currentTurn === 'red' ? '#c00000' : '#111111';
        }

        initGame();
    </script>
</body>
</html>
